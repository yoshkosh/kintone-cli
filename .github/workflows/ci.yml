name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    # NOTE: Corepack は package.json の packageManager で pin された pnpm を
    # 初回実行時に遅延ダウンロードする。Node 22+ 同梱の Corepack 0.20+ では
    # 確認プロンプトが廃止済みだが、runner イメージの Corepack 版が将来巻き戻る
    # / 別ランタイムに差し替わる事故で CI が [Y/n] プロンプトでハングする回帰を
    # 防ぐための保険。
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
